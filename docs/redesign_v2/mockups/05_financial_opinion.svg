<svg xmlns="http://www.w3.org/2000/svg" width="400" height="870" viewBox="0 0 400 870"><rect x="0" y="0" width="400" height="870" rx="0" fill="#fafcfb" stroke="#fafcfb"/><text x="20" y="21" font-family="DejaVu Sans,Arial" font-size="11" fill="#243a32" font-weight="650" text-anchor="start">10:24</text><text x="374" y="21" font-family="DejaVu Sans,Arial" font-size="11" fill="#243a32" font-weight="650" text-anchor="end">● ▰ ▴ 100%</text><text x="18" y="64" font-family="DejaVu Sans,Arial" font-size="24" fill="#132b22" font-weight="800" text-anchor="start">‹  Финансовое заключение</text><rect x="16" y="90" width="368" height="99" rx="13" fill="#e9f8ef" stroke="#dae5de"/><text x="29" y="133" font-family="DejaVu Sans,Arial" font-size="21" fill="#1c3028" font-weight="400" text-anchor="start">Общая оценка</text><text x="370" y="133" font-family="DejaVu Sans,Arial" font-size="21" fill="#087c58" font-weight="700" text-anchor="end">6,7 / 10</text><text x="28" y="162" font-family="DejaVu Sans,Arial" font-size="12" fill="#65796c" font-weight="400" text-anchor="start">Выводы по текущим финансовым данным</text><text x="18" y="218" font-family="DejaVu Sans,Arial" font-size="18" fill="#172e27" font-weight="750" text-anchor="start">Сильные стороны</text><rect x="16" y="231" width="368" height="136" rx="13" fill="#fff" stroke="#dae5de"/><text x="28" y="267" font-family="DejaVu Sans,Arial" font-size="13" fill="#067c57" font-weight="700" text-anchor="start">✓ Положительный денежный поток</text><text x="28" y="289" font-family="DejaVu Sans,Arial" font-size="12" fill="#63796b" font-weight="400" text-anchor="start">Доходы превышают расходы.</text><text x="28" y="323" font-family="DejaVu Sans,Arial" font-size="13" fill="#067c57" font-weight="700" text-anchor="start">✓ Финансовая подушка</text><text x="28" y="345" font-family="DejaVu Sans,Arial" font-size="12" fill="#63796b" font-weight="400" text-anchor="start">Есть резерв на непредвиденные расходы.</text><text x="18" y="396" font-family="DejaVu Sans,Arial" font-size="18" fill="#172e27" font-weight="750" text-anchor="start">Нейтральные замечания</text><rect x="16" y="409" width="368" height="87" rx="13" fill="#fff" stroke="#dae5de"/><text x="28" y="443" font-family="DejaVu Sans,Arial" font-size="13" fill="#334a3e" font-weight="700" text-anchor="start">ⓘ Доходность и допущения</text><text x="28" y="468" font-family="DejaVu Sans,Arial" font-size="12" fill="#667c6e" font-weight="400" text-anchor="start">Проверяйте устойчивость прогноза.</text><text x="18" y="525" font-family="DejaVu Sans,Arial" font-size="18" fill="#172e27" font-weight="750" text-anchor="start">Требует внимания</text><rect x="16" y="538" width="368" height="138" rx="13" fill="#fff9f2" stroke="#dae5de"/><text x="28" y="572" font-family="DejaVu Sans,Arial" font-size="13" fill="#a76604" font-weight="700" text-anchor="start">⚠ Долговая нагрузка  ›</text><text x="28" y="593" font-family="DejaVu Sans,Arial" font-size="12" fill="#1c3028" font-weight="400" text-anchor="start">Контролируйте долговые обязательства.</text><text x="28" y="630" font-family="DejaVu Sans,Arial" font-size="13" fill="#a76604" font-weight="700" text-anchor="start">⚠ Норма сбережений  ›</text><text x="28" y="652" font-family="DejaVu Sans,Arial" font-size="12" fill="#1c3028" font-weight="400" text-anchor="start">Текущая доля ниже целевой.</text><rect x="16" y="686" width="368" height="43" rx="12" fill="#e7f6ec" stroke="#d8e9dd"/><text x="200" y="713" font-family="DejaVu Sans,Arial" font-size="14" fill="#067c57" font-weight="700" text-anchor="middle">Экспорт заключения</text><text x="20" y="757" font-family="DejaVu Sans,Arial" font-size="11" fill="#74887c" font-weight="400" text-anchor="start">Справочная оценка, не финансовый совет.</text></svg>