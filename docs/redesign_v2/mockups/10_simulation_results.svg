<svg xmlns="http://www.w3.org/2000/svg" width="400" height="870" viewBox="0 0 400 870"><rect x="0" y="0" width="400" height="870" rx="0" fill="#fafcfb" stroke="#fafcfb"/><text x="20" y="21" font-family="DejaVu Sans,Arial" font-size="11" fill="#243a32" font-weight="650" text-anchor="start">10:24</text><text x="374" y="21" font-family="DejaVu Sans,Arial" font-size="11" fill="#243a32" font-weight="650" text-anchor="end">● ▰ ▴ 100%</text><text x="18" y="64" font-family="DejaVu Sans,Arial" font-size="24" fill="#132b22" font-weight="800" text-anchor="start">‹  Результаты симуляции</text><rect x="16" y="90" width="368" height="142" rx="13" fill="#e6f8ed" stroke="#dae5de"/><text x="28" y="120" font-family="DejaVu Sans,Arial" font-size="13" fill="#638477" font-weight="400" text-anchor="start">Сравнение с базовым FIRE</text><text x="28" y="178" font-family="DejaVu Sans,Arial" font-size="35" fill="#007b55" font-weight="800" text-anchor="start">−2,5 года</text><text x="28" y="209" font-family="DejaVu Sans,Arial" font-size="12" fill="#177956" font-weight="400" text-anchor="start">Сценарий ускоряет достижение цели</text><text x="18" y="261" font-family="DejaVu Sans,Arial" font-size="18" fill="#172e27" font-weight="750" text-anchor="start">База и сценарий</text><rect x="16" y="274" width="368" height="239" rx="13" fill="#fff" stroke="#dae5de"/><text x="28" y="305" font-family="DejaVu Sans,Arial" font-size="12" fill="#76897e" font-weight="400" text-anchor="start">Показатель</text><text x="371" y="305" font-family="DejaVu Sans,Arial" font-size="12" fill="#76897e" font-weight="500" text-anchor="end">База → Сценарий</text><path d="M28 316L371 316" stroke="#e4ece6"/><text x="29" y="360" font-family="DejaVu Sans,Arial" font-size="13" fill="#1c3028" font-weight="400" text-anchor="start">Срок FIRE</text><text x="370" y="360" font-family="DejaVu Sans,Arial" font-size="13" fill="#087c58" font-weight="700" text-anchor="end">24 → 21,5 г.</text><path d="M28 378L371 378" stroke="#e4ece6"/><text